name: SOC 1 Validation Tests

on:
  pull_request:
    branches: [main, develop]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      report_filter:
        description: 'Filter test reports by name (optional)'
        required: false
        default: ''

jobs:
  validation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/socanalyzer_test
      DATAIKU_DSS_HOST: ${{ secrets.DATAIKU_DSS_HOST }}
      DATAIKU_API_KEY: ${{ secrets.DATAIKU_API_KEY }}
      LLM_PROVIDER: dataiku
      PYTHONPATH: ${{ github.workspace }}
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: socanalyzer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      
      - name: Run database migrations
        working-directory: backend
        run: |
          alembic upgrade head
      
      - name: List available test reports
        run: |
          echo "Available SOC 1 test reports:"
          ls -lh soc1_reports/*.pdf || echo "No test reports found"
      
      - name: Run validation extraction tests
        id: extraction
        run: |
          python test_scripts/run_validation_tests.py \
            --report-filter "${{ github.event.inputs.report_filter }}" \
            --output validation_results.json
        continue-on-error: true
      
      - name: Load baselines and compare
        id: comparison
        run: |
          python test_scripts/compare_baselines.py \
            --results validation_results.json \
            --baseline-dir soc1_reports/baselines \
            --output comparison_report.json
        continue-on-error: true
      
      - name: Generate test report
        if: always()
        run: |
          python test_scripts/generate_report.py \
            --comparison comparison_report.json \
            --output test_report.md
      
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-results
          path: |
            validation_results.json
            comparison_report.json
            test_report.md
            data/logs/*.log
          retention-days: 30
      
      - name: Post results to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = 'Test report not generated';
            try {
              report = fs.readFileSync('test_report.md', 'utf8');
            } catch (e) {
              report = `❌ Failed to generate test report: ${e.message}`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 SOC 1 Validation Test Results\n\n${report}`
            });
      
      - name: Check for regressions
        if: always()
        run: |
          python test_scripts/check_regressions.py \
            --comparison comparison_report.json \
            --threshold 0.05
      
      - name: Send Slack notification
        if: failure() && github.event_name == 'schedule'
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨 SOC 1 Validation Tests Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*SOC 1 Validation Tests Failed*\n\nRegression detected in nightly validation run.\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }

  accuracy-report:
    runs-on: ubuntu-latest
    needs: validation-tests
    if: github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: validation-test-results
      
      - name: Generate accuracy dashboard
        run: |
          python test_scripts/generate_dashboard.py \
            --results validation_results.json \
            --output accuracy_dashboard.html
      
      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-dashboard
          path: accuracy_dashboard.html
          retention-days: 90
