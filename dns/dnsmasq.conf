# DNSMasq configuration for SOCAnalyzer
# Provides local DNS caching with dynamic upstream DNS resolution
# Uses host machine's DNS servers automatically via Docker's DNS inheritance

# Read upstream DNS from /etc/resolv.conf (populated by Docker from host)
# This makes the configuration environment-agnostic
# - Dev: Uses VPN DNS (10.248.204.1)
# - Production: Uses production environment DNS
# Comment out no-resolv to allow reading /etc/resolv.conf
# no-resolv

# Additional upstream DNS servers (fallback)
server=8.8.8.8
server=8.8.4.4

# Cache size (default is 150, increase for better performance)
cache-size=1000

# Log queries for debugging (comment out in production)
log-queries
log-facility=-

# Dynamic DNS resolution via host machine's DNS resolver
# NOTE: Uses host.docker.internal to forward queries to whatever DNS the host uses
# Benefits:
#   - Dev environment: Automatically uses VPN DNS (10.248.204.1)
#   - Production: Uses production environment's configured DNS
#   - Supports load balancer IP changes automatically
#   - No hardcoded IPs or environment-specific configuration needed

# Don't read /etc/hosts
no-hosts

# Don't bind to specific interface (let Docker handle it)
# This allows dnsmasq to listen on all container interfaces including the Docker network
except-interface=lo

# Max TTL for caching
max-ttl=3600
max-cache-ttl=3600
