server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy backend API on the same origin so the SPA can call relative endpoints
  # Backend service name is `backend` in docker-compose (port 8000)
  location /ws {
    proxy_pass http://backend:8000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
  }

  location /settings {
    # Preserve full original URI (including /settings) by omitting path component after host
    proxy_pass http://backend:8000;
  }

  location /config/ {
    proxy_pass http://backend:8000;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
  }

  location /history {
    proxy_pass http://backend:8000/history;
  }

  location /report {
    proxy_pass http://backend:8000$request_uri;
  }

  location /executive_summary {
    proxy_pass http://backend:8000$request_uri;
  }

  location /framework_criteria {
    proxy_pass http://backend:8000/framework_criteria;
  }

  location /analyze {
    proxy_pass http://backend:8000$request_uri;
  }

  location /docker {
    proxy_pass http://backend:8000$request_uri;
  }

  location /auth {
    proxy_pass http://backend:8000$request_uri;
  }

  location /users {
    proxy_pass http://backend:8000$request_uri;
  }

  location / {
    try_files $uri /index.html;
    # Disable caching for SPA entry to ensure latest bundle is picked up
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    etag off;
    if_modified_since off;
  }

  # Optional: cache static assets
  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg)$ {
    # Disable caching completely while iterating locally
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    etag off;
    if_modified_since off;
    access_log off;
  }
}
