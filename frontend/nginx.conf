server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Allow large file uploads (SOC reports can be 50MB+)
  client_max_body_size 100M;

  # Rewrite any Location headers from backend to use the public host
  proxy_redirect http://backend:8000/ /;
  proxy_redirect https://backend:8000/ /;

  # Proxy backend API on the same origin so the SPA can call relative endpoints
  # Backend service name is `backend` in docker-compose (port 8000)
  location /ws {
    proxy_pass http://backend:8000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
  }

  location /settings {
    # Preserve full original URI (including /settings) by omitting path component after host
    proxy_pass http://backend:8000;
  }

  location /config {
    proxy_pass http://backend:8000$request_uri;
  }

  location /history {
    proxy_pass http://backend:8000/history;
  }

  location /report {
    proxy_pass http://backend:8000$request_uri;
  }

  location /pdf {
    proxy_pass http://backend:8000$request_uri;
  }

  location /grace {
    proxy_pass http://backend:8000$request_uri;
  }

  location /baseline {
    proxy_pass http://backend:8000$request_uri;
  }

  location /list_scans {
    proxy_pass http://backend:8000/list_scans;
  }

  location /executive_summary {
    proxy_pass http://backend:8000$request_uri;
  }

  location /export {
    proxy_pass http://backend:8000$request_uri;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /framework_criteria {
    proxy_pass http://backend:8000/framework_criteria;
  }

  location /analyze {
    proxy_pass http://backend:8000$request_uri;
  }

  location /scan_queue {
    proxy_pass http://backend:8000$request_uri;
  }

  location /docker {
    proxy_pass http://backend:8000$request_uri;
  }

  location /auth {
    proxy_pass http://backend:8000$request_uri;
  }

  location /users {
    proxy_pass http://backend:8000$request_uri;
  }

  location /test {
    proxy_pass http://backend:8000$request_uri;
  }

  location /diag {
    proxy_pass http://backend:8000$request_uri;
  }

  location /validate {
    proxy_pass http://backend:8000$request_uri;
  }

  location /help {
    proxy_pass http://backend:8000$request_uri;
  }

  location /dataiku-health {
    proxy_pass http://backend:8000$request_uri;
  }

  location / {
    try_files $uri /index.html;
    # Disable caching for SPA entry to ensure latest bundle is picked up
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    etag off;
    if_modified_since off;
  }

  # Optional: cache static assets
  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg)$ {
    # Disable caching completely while iterating locally
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    etag off;
    if_modified_since off;
    access_log off;
  }
}
